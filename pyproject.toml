[build-system]
requires = ["hatchling>=1.25,<1.32"]
build-backend = "hatchling.build"

[project]
name = "skout-scan"
version = "0.1.0"
description = "Skout Scan finds potentially untested behaviors in AI-agent repositories."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Puja Kamath" }
]
maintainers = [
  { name = "Puja Kamath" }
]
keywords = [
  "ai",
  "agents",
  "cli",
  "evals",
  "agent-testing",
  "evaluation",
  "static-analysis",
  "testing",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "build>=1.2,<2.0",
  "twine>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/skouthq/skout-scan"
Documentation = "https://github.com/skouthq/skout-scan#readme"
Repository = "https://github.com/skouthq/skout-scan"
Issues = "https://github.com/skouthq/skout-scan/issues"

[project.scripts]
skout = "agentguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/agentguard",
  "/docs/releasing.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src/agentguard"]

[tool.coverage.run]
source = ["agentguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
